{% extends "dashboard/base.html" %}

{% block title %}
    <title>Удалить уведомление</title>
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-6">
            <h2>Удалить уведомление</h2>
            <p>Вы уверены, что хотите удалить уведомление для акции <b>{{ object.share.ticker }}</b>?</p>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Удалить</button>
                <a href="{% url 'dashboard:price_alert_list' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
