{% extends "dashboard/base.html" %}

{% block title %}
    <title>Создать уведомление о цене</title>
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-6">
            <h2>Создать уведомление о цене</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary w-100" type="submit">Создать</button>
                <a href="{% url 'dashboard:price_alert_list' %}" class="btn btn-outline-secondary w-100 mt-2">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
