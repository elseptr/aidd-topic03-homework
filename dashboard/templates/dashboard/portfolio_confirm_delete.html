{% extends "dashboard/base.html" %}

{% block title %}
    <title>Удалить портфель</title>
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-6">
            <h2>Удалить портфель</h2>
            <p>Вы уверены, что хотите удалить портфель <b>"{{ object.name }}"</b>?</p>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Удалить</button>
                <a href="{% url 'dashboard:portfolio_list' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
